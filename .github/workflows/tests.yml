name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: skillstat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations
        working-directory: backend
        run: flask db upgrade
        env:
          FLASK_ENV: "testing"
          SECRET_KEY: "test-secret-key"
          TEST_DATABASE_URL: "postgresql://usuario:password@localhost:5432/skillstat_test"
          JWT_SECRET_KEY: "test-jwt-secret"
          GOOGLE_CLIENT_ID: "test-google-client-id"
          FRONTEND_BASE_URL: "http://localhost:5500/frontend"
          PIPELINE_TRIGGER_SECRET: "test-pipeline-secret"
          RESEND_API_KEY: "test-resend-api-key"

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=xml
        env:
          FLASK_ENV: "testing"
          SECRET_KEY: "test-secret-key"
          TEST_DATABASE_URL: "postgresql://usuario:password@localhost:5432/skillstat_test"
          JWT_SECRET_KEY: "test-jwt-secret"
          GOOGLE_CLIENT_ID: "test-google-client-id"
          FRONTEND_BASE_URL: "http://localhost:5500/frontend"
          PIPELINE_TRIGGER_SECRET: "test-pipeline-secret"
          RESEND_API_KEY: "test-resend-api-key"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          fail_ci_if_error: false
