<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Distribución regional de la demanda tecnológica en México."
    />
    <title>SkillStat - Regiones</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/images/brand/favicon.svg"
    />
    <link
      rel="alternate icon"
      type="image/x-icon"
      href="../assets/images/brand/favicon.ico"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;700&family=Bakbak+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/pages/regiones.css" />
  </head>
  <body>
    <header class="site-header" role="banner">
      <nav class="navbar" role="navigation" aria-label="Navegación principal">
        <button
          class="navbar__menu-toggle"
          type="button"
          aria-label="Abrir menú"
          aria-expanded="false"
          data-nav-drawer-open
        >
          <i data-lucide="menu"></i>
        </button>

        <a
          href="../views/index.html"
          class="navbar__logo"
          aria-label="SkillStat - Inicio"
        >
          <img
            src="../assets/images/brand/skillstat-logo-compact.svg"
            alt="SkillStat"
            width="32"
            height="32"
            class="navbar__logo-img"
          />
          SkillStat
        </a>

        <ul class="navbar__links" role="list">
          <li>
            <a href="panorama.html" class="navbar__link">Panorama</a>
          </li>
          <li><a href="comparar.html" class="navbar__link">Comparar</a></li>
          <li>
            <a href="habilidades.html" class="navbar__link">Habilidades</a>
          </li>
          <li>
            <a href="salarios.html" class="navbar__link">Salarios</a>
          </li>
          <li>
            <a
              href="regiones.html"
              class="navbar__link navbar__link--active"
              aria-current="page"
              >Regiones</a
            >
          </li>
          <li>
            <a href="#" class="navbar__link" data-pending-page>Reportes</a>
          </li>
        </ul>

        <div class="navbar__actions">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Cambiar tema"
          >
            <i
              data-lucide="sun"
              class="theme-toggle__icon theme-toggle__icon--sun"
            ></i>
            <i
              data-lucide="moon"
              class="theme-toggle__icon theme-toggle__icon--moon"
            ></i>
          </button>
          <button
            class="navbar__logout"
            type="button"
            aria-label="Cerrar sesión"
            data-auth-action="logout"
          >
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </nav>
    </header>

    <div class="nav-drawer" data-nav-drawer aria-hidden="true">
      <div class="nav-drawer__backdrop" data-nav-drawer-close></div>
      <div
        class="nav-drawer__panel"
        role="dialog"
        aria-modal="true"
        aria-label="Menú de navegación"
      >
        <div class="nav-drawer__header">
          <a
            href="../views/index.html"
            class="navbar__logo"
            aria-label="SkillStat - Inicio"
          >
            <img
              src="../assets/images/brand/skillstat-logo-compact.svg"
              alt="SkillStat"
              width="28"
              height="28"
              class="navbar__logo-img"
            />
            SkillStat
          </a>
          <div class="nav-drawer__header-actions">
            <button
              class="theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="Cambiar tema"
            >
              <i
                data-lucide="sun"
                class="theme-toggle__icon theme-toggle__icon--sun"
              ></i>
              <i
                data-lucide="moon"
                class="theme-toggle__icon theme-toggle__icon--moon"
              ></i>
            </button>
            <button
              class="nav-drawer__close"
              type="button"
              aria-label="Cerrar menú"
              data-nav-drawer-close
            >
              <i data-lucide="x"></i>
            </button>
          </div>
        </div>

        <ul class="nav-drawer__links" role="list">
          <li>
            <a href="panorama.html" class="nav-drawer__link">Panorama</a>
          </li>
          <li><a href="comparar.html" class="nav-drawer__link">Comparar</a></li>
          <li>
            <a href="habilidades.html" class="nav-drawer__link">Habilidades</a>
          </li>
          <li>
            <a href="salarios.html" class="nav-drawer__link">Salarios</a>
          </li>
          <li>
            <a
              href="regiones.html"
              class="nav-drawer__link nav-drawer__link--active"
              aria-current="page"
              >Regiones</a
            >
          </li>
          <li>
            <a href="#" class="nav-drawer__link" data-pending-page>Reportes</a>
          </li>
        </ul>

        <button
          class="nav-drawer__logout"
          type="button"
          data-auth-action="logout"
        >
          <i data-lucide="log-out"></i>
          Cerrar sesión
        </button>
      </div>
    </div>

    <main>
      <section class="panorama-skills">
        <div class="container">
          <div class="panorama-skills__header">
            <h1>Regiones</h1>
            <p class="panorama-skills__subtitle text-body-sm">
              Demanda agregada por estado
            </p>
          </div>

          <div class="regions-chart surface scroll-row" data-regions-chart>
            <!-- Renderizado por JS -->
          </div>

          <div
            class="regions-unmapped text-body-sm"
            data-regions-unmapped
            style="
              display: none;
              text-align: center;
              margin-top: var(--space-4);
              color: var(--color-text-secondary);
            "
          >
            <!-- Renderizado por JS -->
          </div>
        </div>
      </section>
    </main>

    <script src="../assets/js/utils/formatters.js"></script>
    <script src="../assets/js/api/client.js"></script>
    <script src="../assets/js/api/panorama.api.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="../assets/js/components/icons.init.js"></script>
    <script src="../assets/js/components/navbar.js"></script>
    <script src="../assets/js/pages/regiones.js"></script>
  </body>
</html>
